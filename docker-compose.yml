# Homebox Pricer stack.
#
# This compose file owns only the pricing sidecar and its Ollama dependency.
# Homebox Companion (capture UI) runs separately — see its own docs at
# https://github.com/Duelion/homebox-companion for how to configure it.
# Homebox itself is also NOT managed here — it runs on the NAS.
#
# Model provisioning is automatic: `ollama-init` pulls PRICE_TEXT_MODEL into
# the shared `ollama` volume on first `docker compose up`, and price-lookup
# only starts once that pull has completed — no manual `ollama pull` required.
#
# Copy .env.example to .env and fill it in before `docker compose up`.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # `ollama list` talks to the daemon's API — true readiness, not just
      # "the binary exists".
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: pull the local price-parsing model, then exit 0. Idempotent —
  # if the model is already in the volume, `ollama pull` is a fast no-op.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      PRICE_TEXT_MODEL: ${PRICE_TEXT_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling price model: $${PRICE_TEXT_MODEL}";
        ollama pull "$${PRICE_TEXT_MODEL}";
        echo "Model ready: $${PRICE_TEXT_MODEL}";
    restart: "no"

  price-lookup:
    build: ./price-lookup
    container_name: price-lookup
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      HOMEBOX_URL: ${HOMEBOX_URL}
      HOMEBOX_TOKEN: ${HOMEBOX_TOKEN:-}
      HOMEBOX_USER: ${HOMEBOX_USER:-}
      HOMEBOX_PASSWORD: ${HOMEBOX_PASSWORD:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PRICE_TEXT_MODEL: ${PRICE_TEXT_MODEL:-qwen2.5:3b}
      PRICE_REGION: ${PRICE_REGION:-au-en}
      PRICE_CURRENCY: ${PRICE_CURRENCY:-AUD}
      PRICE_MIN_CONFIDENCE: ${PRICE_MIN_CONFIDENCE:-low}
      PRICE_USE_STATICICE: ${PRICE_USE_STATICICE:-true}
      PRICES_API_KEY: ${PRICES_API_KEY:-}
      PRICES_API_URL: ${PRICES_API_URL:-https://api.pricesapi.io/api/v1/products/search}
      PRICES_API_COUNTRY: ${PRICES_API_COUNTRY:-au}
      PRICES_API_TIMEOUT: ${PRICES_API_TIMEOUT:-90.0}
      PRICE_FETCH_PAGES: ${PRICE_FETCH_PAGES:-3}
      PRICE_FETCH_TIMEOUT: ${PRICE_FETCH_TIMEOUT:-8.0}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-3600}
      SERVER_PORT: ${SERVER_PORT:-8091}
      DB_PATH: ${DB_PATH:-/data/price.db}
      LOG_FORMAT: ${LOG_FORMAT:-plain}
    volumes:
      - price-data:/data
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama:
  price-data:
